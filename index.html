<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Starry Night — Animated | Vincent van Gogh</title>
<meta name="description" content="A real-time WebGL animation of Vincent van Gogh's The Starry Night: rotating whirlpools, spinning stars, flickering village lights and a gentle generative soundtrack — every color stays true to the original painting.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%230e1b42' width='32' height='32' rx='6'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23f8de5c'/%3E%3Ccircle cx='16' cy='13' r='2.4' fill='%23fff8d8'/%3E%3Ccircle cx='8' cy='23' r='2.2' fill='%23f2c832'/%3E%3Ccircle cx='24' cy='23' r='2.2' fill='%23f2c832'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ========== The painting — nothing else on the page ========== -->
<main id="stage" class="stage" aria-label="Animated painting">
  <div class="frame">
    <div class="canvas-wrap">
      <canvas id="starry-canvas" aria-label="Animated Starry Night — click the sky to summon a shooting star"></canvas>
      <div id="loading" class="loading">
        <div class="loading-ring"></div>
        <p>Awakening the night sky…</p>
      </div>
      <div id="fallback" class="fallback" hidden>
        <img alt="The Starry Night (static fallback)">
        <p>Your browser does not support WebGL — showing the original painting instead</p>
      </div>
    </div>
  </div>
</main>

<!-- Music toggle (browsers require a visible control for sound) -->
<button id="music-btn" class="music-btn" type="button"
        aria-label="Play music" aria-pressed="false" title="Play / pause music (M)">
  <svg class="ic-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    <path d="M9 18.2a3 3 0 1 1-2-2.83V6.2a1 1 0 0 1 .76-.97l9-2.25A1 1 0 0 1 18 3.94v11.4a3 3 0 1 1-2-2.83V7.28l-7 1.75z"/>
  </svg>
  <svg class="ic-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    <path d="M9 18.2a3 3 0 1 1-2-2.83V6.2a1 1 0 0 1 .76-.97l9-2.25A1 1 0 0 1 18 3.94v11.4a3 3 0 1 1-2-2.83V7.28l-7 1.75z"/>
    <path class="slash" d="M4.5 3.5l16 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>

<!-- One-time hint: browsers only allow audio after a user interaction -->
<div id="sound-hint" class="sound-hint" role="status">
  <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
    <path d="M9 18.2a3 3 0 1 1-2-2.83V6.2a1 1 0 0 1 .76-.97l9-2.25A1 1 0 0 1 18 3.94v11.4a3 3 0 1 1-2-2.83V7.28l-7 1.75z"/>
  </svg>
  <span>Click anywhere to let the music in</span>
</div>

<div id="error-box" class="error-box" role="alert"></div>

<script src="js/scene-data.js"></script>
<script src="js/music.js"></script>
<script src="js/starry-engine.js"></script>
<script src="js/main.js"></script>
</body>
</html>
